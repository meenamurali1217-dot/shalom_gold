<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Gold Savings Account — Shalom Gold</title>
  <meta name="description" content="Open your official Shalom Gold savings account in 2 minutes. Start accumulating 100% BIS hallmarked gold with guaranteed bonus months.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="16x16">
  <!-- bootstrap 4  -->
  <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
  <!-- fontawesome 5  -->
  <link rel="stylesheet" href="assets/css/all.min.css">
  <!-- line-awesome webfont -->
  <link rel="stylesheet" href="assets/css/line-awesome.min.css">
  <link rel="stylesheet" href="assets/css/vendor/animate.min.css">
  <!-- slick slider css -->
  <link rel="stylesheet" href="assets/css/vendor/slick.css">
  <link rel="stylesheet" href="assets/css/vendor/dots.css">
  <!-- dashboard main css -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
  <body>
    <div class="preloader">
      <div class="preloader-container">
        <span class="animated-preloader"></span>
      </div>
    </div>
  
    <!-- scroll-to-top start -->
    <div class="scroll-to-top">
      <span class="scroll-icon">
        <i class="fa fa-rocket" aria-hidden="true"></i>
      </span>
    </div>
    <!-- scroll-to-top end -->

  <div class="full-wh">
    <!-- STAR ANIMATION -->
    <div class="bg-animation">
      <div id='stars'></div>
      <div id='stars2'></div>
      <div id='stars3'></div>
      <div id='stars4'></div>
    </div><!-- / STAR ANIMATION -->
  </div>
  <div class="page-wrapper">
  
    <!-- account section start -->
    <div class="account-section bg_img" data-background="assets/images/bg/bg-5.jpg">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-xl-5 col-lg-7">
            <div class="account-card">
              <div class="account-card__header bg_img overlay--one" data-background="assets/images/bg/bg-6.jpg">
                <div class="text-center mb-3">
                  <a href="index.html"><img src="assets/images/logo.png" alt="Shalom Gold" style="max-height: 55px;"></a>
                </div>
                <h2 class="section-title text-center">Welcome to <span class="base--color">Shalom Gold</span></h2>
                <p class="text-center">Begin your disciplined gold accumulation journey. 100% BIS Hallmarked physical gold backing with guaranteed bonus months.</p>
              </div>
              <div class="account-card__body">
                <h3 class="text-center">Create Gold Account</h3>
                <form class="mt-4" action="dashboard.html">
                  <div class="form-group">
                    <label>Full Legal Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name as per Aadhaar / PAN" required>
                  </div>
                  <div class="form-group">
                    <label>Mobile Number (+91)</label>
                    <input type="tel" class="form-control" placeholder="10-digit mobile number for OTP" required>
                  </div>
                  <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter email address" required>
                  </div>
                  <div class="form-group">
                    <label>Preferred Scheme Plan</label>
                    <select class="form-control base--bg text-dark font-weight-600">
                      <option>1 Year Smart Gold Plan (11+1 Bonus)</option>
                      <option>2 Years Wealth Gold Plan (22+2 Bonus)</option>
                      <option>3 Years Sovereign Gold Plan (33+3 Bonus)</option>
                      <option>5 Years Legacy Gold Plan (55+5 Bonus)</option>
                      <option>Gold Hold & Grow (2% Monthly Benefit)</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Set Secure Password</label>
                    <input type="password" class="form-control" placeholder="Enter strong password" required>
                  </div>
                  <div class="form-row">
                    <div class="col-sm-12">
                      <div class="form-group form-check">
                        <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
                        <label class="form-check-label f-size-14" for="termsCheck">I agree to Shalom Gold Terms, Vault Custody Agreement & BIS Hallmarking Policy</label>
                      </div>
                    </div>
                  </div>
                  <div class="mt-3">
                    <button type="submit" class="cmn-btn">Open Account Now</button>
                  </div>
                  <div class="text-center mt-3">
                    <p class="f-size-14">Already registered? <a href="login.html" class="base--color">Sign In</a></p>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- account section end -->

  </div> <!-- page-wrapper end -->
    <!-- jQuery library -->
  <script src="assets/js/vendor/jquery-3.5.1.min.js"></script>
  <!-- bootstrap js -->
  <script src="assets/js/vendor/bootstrap.bundle.min.js"></script>
  <!-- slick slider js -->
  <script src="assets/js/vendor/slick.min.js"></script>
  <script src="assets/js/vendor/wow.min.js"></script>
  <script src="assets/js/contact.js"></script>
  <!-- dashboard custom js -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth-nav.js"></script>
</body>

</html>
